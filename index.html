etter RSI») на дневных свечах: RSI(14) выше 69 — зелёный цикл, ниже 31 — красный; зелёный кончается ниже 39, красный — выше 61. Коробка — день рождения цикла: зелёная — от закрытия до максимума, красная — от минимума до закрытия. Живёт, пока цикл цветной.","Пробой — сглаженная линия цены на свечах 6ч пересекает верх (вверх) или низ (вниз) живой коробки. Это сценарий, а не сигнал."],bd:"Коробки 1D",bd_status:"Дневные коробки вверх за {p}: {n} · новые коробки и пробои вверх · обновлено {t}",bd_none:"За {p} дневных коробок и пробоев вверх нет.",bd_status_dn:"Дневные коробки вниз за {p}: {n} · новые коробки и пробои вниз · обновлено {t}",bd_none_dn:"За {p} дневных коробок и пробоев вниз нет.",bd_tag:"1D",bd_notes:["Дневная коробка — диапазон сигнальной дневной свечи: дня, который открылся по одну сторону медленной дневной линии (сглаженная цена дневных свечей) и закрылся по другую. День роста — от закрытия до максимума; день падения — от минимума до закрытия. Живёт, пока не появится следующая. Такие коробки реже и шире, чем на 6ч: стоп шире, позиция меньше.","Пробой — сглаженная линия цены на свечах 6ч пересекает верх коробки (вверх) или низ (вниз). Это сценарий, а не сигнал."],bx_status:"Коробки вверх за {p}: {n} · новые коробки и пробои вверх · обновлено {t}",bx_none:"За {p} коробок и пробоев вверх нет.",bx_status_dn:"Коробки вниз за {p}: {n} · новые коробки и пробои вниз · обновлено {t}",bx_none_dn:"За {p} коробок и пробоев вниз нет.",bx_new:"Новая коробка ▲",bx_new_dn:"Новая коробка ▼",bx_brk:"Пробой коробки вверх",bx_brk_dn:"Пробой коробки вниз",bx_top:"верх коробки",bx_bot:"низ коробки",bx_notes:["Коробка — диапазон сигнальной дневной свечи: дня, который открылся по одну сторону медленной линии (сглаженная цена, свечи 6ч) и закрылся по другую. День роста — от закрытия до максимума; день падения — от минимума до закрытия. Коробка живёт, пока не появится следующая.","Пробой — сглаженная линия цены на 30м пересекает верх коробки (вверх) или низ (вниз). На карточках —
